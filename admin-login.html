<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login - CivicPulse</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-wrap{max-width:420px;margin:60px auto;padding:28px;border-radius:12px;background:#fff;border:1px solid rgba(16,32,51,0.06)}
    .login-wrap h2{margin:0 0 12px}
    .form-row{margin-bottom:12px}
    .form-row input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(16,32,51,0.08)}
    .actions{display:flex;gap:8px;align-items:center}
  </style>
</head>
<body>
  <div class="container">
    <div class="login-wrap">
      <h2>Admin sign in</h2>
      <p>Enter your admin credentials to access the dashboard.</p>
      <form id="login-form">
        <div class="form-row">
          <input id="username" name="username" placeholder="Username" required />
        </div>
        <div class="form-row">
          <input id="password" name="password" type="password" placeholder="Password" required />
        </div>
        <div class="form-row actions">
          <button class="btn primary" type="submit">Sign in</button>
          <a href="/" class="btn">Back</a>
        </div>
        <div id="login-status" style="margin-top:10px;color:#c94b4b"></div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const status = document.getElementById('login-status');
      status.textContent = '';
      try {
        const res = await fetch('/login', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: u, password: p })
        });
        const j = await res.json();
        if (res.ok && j.success) {
          window.location.href = '/admin';
        } else {
          status.textContent = j.error || 'Login failed';
        }
      } catch (err) {
        status.textContent = 'Network error';
      }
    });
  </script>
</body>
</html>
